[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp-solver"
version = "0.2.0"
description = "Exact, local-search and metaheuristic algorithms for the Traveling Salesman Problem"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Esad Kopru"}]
requires-python = ">=3.8"
dependencies = ["numpy>=1.20.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.3.0"]
benchmark = ["pandas>=1.3.0"]
all = ["matplotlib>=3.3.0", "pandas>=1.3.0"]
dev = ["matplotlib>=3.3.0", "pandas>=1.3.0", "pytest>=7.0"]

[project.scripts]
tsp-solver = "tsp_solver.cli:main"

[project.urls]
Homepage = "https://github.com/efkopru/traveling-salesman"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` run from a plain checkout, without `pip install -e .`
pythonpath = ["src"]
