name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.8 is not built for Ubuntu 26.04 (ubuntu-latest), so that job
    # stays on the newest image that still provides it.
    runs-on: ${{ matrix.python-version == '3.8' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.8", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: tsp-solver solve data/tsplib/eil51.tsp -a 2-opt
